[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-agent"
version = "0.1.0"
description = "XGEN 3.0 — 대화 기반 AI Agent Runtime 플랫폼"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "sse-starlette>=2.0.0",
    "graph-tool-call>=0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
xgen-agent = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
